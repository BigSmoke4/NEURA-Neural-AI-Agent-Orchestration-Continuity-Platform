name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NEURA.sln

      - name: Build
        run: dotnet build NEURA.sln --no-restore -c Release

      - name: Unit + integration tests
        run: dotnet test tests/Neura.Tests/Neura.Tests.csproj --no-build -c Release --verbosity normal --logger "trx;LogFileName=neura-tests.trx"
        # PostgresIntegrationTests needs a Docker daemon, which GitHub-hosted
        # ubuntu-latest runners provide out of the box; SignalRRoundTripTests
        # and EndToEndMissionTests need nothing beyond the .NET SDK.

      - name: Annotate failed test details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          namespace = {"trx": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          failures = []
          for path in glob.glob("tests/Neura.Tests/**/neura-tests.trx", recursive=True):
              root = ET.parse(path).getroot()
              for result in root.findall(".//trx:UnitTestResult", namespace):
                  if result.get("outcome") != "Failed":
                      continue
                  name = result.get("testName", "unknown test")
                  error = result.find("trx:Output/trx:ErrorInfo", namespace)
                  message = error.findtext("trx:Message", default="", namespaces=namespace) if error is not None else ""
                  stack = error.findtext("trx:StackTrace", default="", namespaces=namespace) if error is not None else ""
                  detail = f"{name}: {message.strip()}\n{stack.strip()}".strip()
                  failures.append(detail[:3000])

          def escape_command_data(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for detail in failures[:20]:
              print(f"::error title=Unit test failure::{escape_command_data(detail)}")
          if not failures:
              print("No failed-test details were found in TRX output.")
          elif len(failures) > 20:
              print(f"::error title=Unit test failure summary::Showing 20 of {len(failures)} failures.")
          PY
        # GitHub's check annotations expose test failures even when raw runner
        # log downloads are unavailable to contributors.

  # One-time scaffold for this release gate. Remove this temporary job after
  # downloading and reviewing its migration artifact into the source tree.
  scaffold-initial-migration:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'arena/048f16f8-neura-neural-ai-agent-orchestr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install matching EF Core tooling
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.30
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Scaffold the reviewed model baseline
        env:
          NEURA_EF_CONNECTION_STRING: Host=localhost;Database=neura;Username=neura;Password=design-time-only
        run: |
          dotnet restore src/Web/Web.csproj
          dotnet ef migrations add InitialBaseline \
            --project src/Infrastructure/Infrastructure.csproj \
            --startup-project src/Web/Web.csproj \
            --context NeuraDbContext \
            --output-dir Persistence/Migrations

      - name: Upload baseline migration and snapshot
        uses: actions/upload-artifact@v4
        with:
          name: neura-initial-baseline
          path: src/Infrastructure/Persistence/Migrations/
          if-no-files-found: error
          retention-days: 7

  browser-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/Neura.E2E.Tests/Neura.E2E.Tests.csproj

      - name: Build
        run: dotnet build tests/Neura.E2E.Tests/Neura.E2E.Tests.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Neura.E2E.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Start NEURA for browser E2E
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Neura__DataProtectionKeyPath: ${{ runner.temp }}/neura-dp-keys
        run: |
          mkdir -p "${{ runner.temp }}/neura-dp-keys"
          nohup dotnet run --project src/Web/Web.csproj -c Release --no-build --no-restore --urls http://127.0.0.1:5080 > "${{ runner.temp }}/neura-e2e.log" 2>&1 &
          echo $! > "${{ runner.temp }}/neura-e2e.pid"
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5080/health/live > /dev/null; then
              echo "NEURA is ready"
              exit 0
            fi
            sleep 1
          done
          cat "${{ runner.temp }}/neura-e2e.log"
          exit 1

      - name: Browser E2E tests
        env:
          NEURA_E2E_BASE_URL: http://127.0.0.1:5080
        run: dotnet test tests/Neura.E2E.Tests/Neura.E2E.Tests.csproj -c Release --no-build --verbosity normal --logger "trx;LogFileName=neura-e2e-tests.trx"

      - name: Annotate browser E2E failure details
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          namespace = {"trx": "http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          failures = []
          for path in glob.glob("tests/Neura.E2E.Tests/**/neura-e2e-tests.trx", recursive=True):
              root = ET.parse(path).getroot()
              for result in root.findall(".//trx:UnitTestResult", namespace):
                  if result.get("outcome") != "Failed":
                      continue
                  name = result.get("testName", "unknown browser test")
                  error = result.find("trx:Output/trx:ErrorInfo", namespace)
                  message = error.findtext("trx:Message", default="", namespaces=namespace) if error is not None else ""
                  stack = error.findtext("trx:StackTrace", default="", namespaces=namespace) if error is not None else ""
                  failures.append(f"{name}: {message.strip()}\n{stack.strip()}".strip()[:3000])

          def escape_command_data(value):
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          for detail in failures[:20]:
              print(f"::error title=Browser E2E test failure::{escape_command_data(detail)}")
          if not failures:
              print("No failed browser E2E test details were found in TRX output.")
          elif len(failures) > 20:
              print(f"::error title=Browser E2E failure summary::Showing 20 of {len(failures)} failures.")
          PY

      - name: Stop NEURA browser E2E server
        if: always()
        shell: bash
        run: |
          if [ -f "${{ runner.temp }}/neura-e2e.pid" ]; then kill "$(cat "${{ runner.temp }}/neura-e2e.pid")" || true; fi
          if [ -f "${{ runner.temp }}/neura-e2e.log" ]; then tail -n 100 "${{ runner.temp }}/neura-e2e.log"; fi
