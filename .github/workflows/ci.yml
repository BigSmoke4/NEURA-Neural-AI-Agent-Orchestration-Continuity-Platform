name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore NEURA.sln

      - name: Build
        run: dotnet build NEURA.sln --no-restore -c Release

      - name: Unit + integration tests
        run: dotnet test tests/Neura.Tests/Neura.Tests.csproj --no-build -c Release --verbosity normal
        # PostgresIntegrationTests needs a Docker daemon, which GitHub-hosted
        # ubuntu-latest runners provide out of the box; SignalRRoundTripTests
        # and EndToEndMissionTests need nothing beyond the .NET SDK.

  browser-e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/Neura.E2E.Tests/Neura.E2E.Tests.csproj

      - name: Build
        run: dotnet build tests/Neura.E2E.Tests/Neura.E2E.Tests.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Neura.E2E.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Start NEURA for browser E2E
        shell: bash
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          ASPNETCORE_URLS: http://127.0.0.1:5080
          Neura__Mode: Simulation
          Neura__DataProtectionKeyPath: ${{ runner.temp }}/neura-dp-keys
        run: |
          mkdir -p "${{ runner.temp }}/neura-dp-keys"
          nohup dotnet run --project src/Web/Web.csproj -c Release --no-build --no-restore --urls http://127.0.0.1:5080 > "${{ runner.temp }}/neura-e2e.log" 2>&1 &
          echo $! > "${{ runner.temp }}/neura-e2e.pid"
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5080/health/live > /dev/null; then
              echo "NEURA is ready"
              exit 0
            fi
            sleep 1
          done
          cat "${{ runner.temp }}/neura-e2e.log"
          exit 1

      - name: Browser E2E tests
        env:
          NEURA_E2E_BASE_URL: http://127.0.0.1:5080
        run: dotnet test tests/Neura.E2E.Tests/Neura.E2E.Tests.csproj -c Release --no-build --verbosity normal

      - name: Stop NEURA browser E2E server
        if: always()
        shell: bash
        run: |
          if [ -f "${{ runner.temp }}/neura-e2e.pid" ]; then kill "$(cat "${{ runner.temp }}/neura-e2e.pid")" || true; fi
          if [ -f "${{ runner.temp }}/neura-e2e.log" ]; then tail -n 100 "${{ runner.temp }}/neura-e2e.log"; fi
